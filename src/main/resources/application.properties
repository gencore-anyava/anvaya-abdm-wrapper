# sandbox = sbx, production = abdm
environment=${ABDM_ENVIRONMENT:sbx}


# v1 or v3 version
spring.profiles.active=${SPRING_PROFILES_ACTIVE:v3}

#Credentials
clientId=${ABDM_CLIENT_ID:}
clientSecret=${ABDM_CLIENT_SECRET:}

# Logging of the outbound cUrl for debugging
logCurl=${LOG_CURL:false}

#MonogDb Connection
# Anvaya: full connection string so MongoDB Atlas (mongodb+srv://) works. Set MONGODB_URI from Secret Manager.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/abdm_wrapper}
spring.data.mongodb.database=${MONGODB_DATABASE:abdm_wrapper}


# Cloud Run injects PORT
server.port=${PORT:8082}

#Proxy settings
useProxySettings=false
proxyHost=
proxyPort=8080

# <=============== READ ONLY ===============>
# LOGGER
logging.level.in.nha.abdm.wrapper=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=TRACE
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=TRACE
logging.level.org.springframework.web.HttpLogging=TRACE

spring.task.scheduling.pool.size=10
connectionTimeout=3000
responseTimeout=5

spring.banner.location=classpath:banner.txt
# <===============================================>


# <==================== ANVAYA ========================>
# Facade API authentication (#6). Callers (Anvaya core) send header X-API-Key.
# Comma-separated list allows key rotation. Startup fails if enabled with no keys.
anvaya.facade-auth.enabled=${FACADE_AUTH_ENABLED:true}
anvaya.facade-auth.api-keys=${FACADE_API_KEYS:}

# Gateway callback JWT verification (#7). Disable only for the mock gateway.
anvaya.gateway-auth.enabled=${GATEWAY_AUTH_ENABLED:true}
anvaya.gateway-auth.jwks-url=${GATEWAY_JWKS_URL:https://dev.abdm.gov.in/api/hiecm/gateway/v3/certs}

# Gateway session token (#1): refresh this many seconds before expiry.
anvaya.session.refresh-skew-seconds=${SESSION_REFRESH_SKEW_SECONDS:120}
